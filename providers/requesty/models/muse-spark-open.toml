name = "muse-spark-open"
description = "Muse Spark Open is an open weights reasoning model from Meta optimized for agentic coding, with reliable tool calling, deep codebase understanding and native image understanding. Sparse MoE with 816B total and 42B active parameters, 1M token context."
family = "muse"
release_date = "2026-10-15"
last_updated = "2026-10-15"
attachment = true
reasoning = true
tool_call = true
structured_output = false
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[cost]
input = 1.25
output = 4.25
cache_read = 0.15

[limit]
context = 1_048_576
output = 131_072

[modalities]
input = ["text", "image"]
output = ["text"]
